<!doctype html>
<html lang="en">

<title>Chump Change</title>
<style>body{margin:0;background:#3a1ca8}</style>
</head>
<body>
<script>
fetch('index.html.html').then(function(r){return r.text();}).then(function(t){
  var css='<style>:root{--bg:#3a1ca8;--card:#4a22c8;--bd:#b48cff;--pink:#ff5ce6;--sky:#8ff0ff;--lime:#c8ff4d;--mut:#efe9ff}img{filter:saturate(1.25) brightness(1.1)}</style>';
  t=t.replace(/(>[^<]*?)\bMike\b/g,'$1Homie').replace('</head>',css+'</head>');
  document.open();document.write(t);document.close();
}).catch(function(){location.replace('index.html.html');});
</script>
</body>
